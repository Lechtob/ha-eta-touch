name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install checks
        run: python -m pip install -r requirements_test.txt
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall custom_components tests
      - name: Unit and Home Assistant integration tests
        run: pytest --cov=custom_components.eta_touch --cov-branch --cov-report=term-missing --cov-report=json
      - name: Require full config flow coverage
        run: |
          python - <<'PY'
          import json
          with open("coverage.json") as report:
              coverage = json.load(report)
          flow = coverage["files"]["custom_components/eta_touch/config_flow.py"]
          assert not flow["missing_lines"], flow["missing_lines"]
          assert not flow["missing_branches"], flow["missing_branches"]
          PY
